[package]
name = "sw-tools-web"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
sw-tools = { git = "https://github.com/nukecat/sw-tools", default-features = false }
sw-formats = { git = "https://github.com/nukecat/sw-formats", version = "0.1.0" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
